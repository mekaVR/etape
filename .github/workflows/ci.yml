name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  guard-generated:
    name: Guard against committed generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Prisma generated client is not tracked
        run: |
          if git ls-files apps/api/src/generated | grep -q .; then
            echo "::error::Generated Prisma client is tracked in git. It must be gitignored."
            git ls-files apps/api/src/generated
            exit 1
          fi

  build:
    name: Install, generate, type-check, lint
    runs-on: ubuntu-latest
    needs: guard-generated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint
